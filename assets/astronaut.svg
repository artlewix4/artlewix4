<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="A small astronaut floating in space">
  <defs>
    <style>
      .star { fill: #e6e8eb; animation: twinkle 5s ease-in-out infinite; }
      .s2 { animation-delay: 1.6s; }
      .s3 { animation-delay: 3.2s; }
      .float { animation: float 7s ease-in-out infinite; transform-origin: 160px 160px; }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
      @keyframes float {
        0%, 100% { transform: translateY(-7px) rotate(-22deg); }
        50% { transform: translateY(7px) rotate(-14deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .star, .float { animation: none; }
        .float { transform: rotate(-18deg); }
      }
    </style>
  </defs>

  <rect width="320" height="320" rx="10" fill="#050608"/>

  <circle class="star" cx="38" cy="46" r="1.3"/>
  <circle class="star s2" cx="92" cy="28" r="1"/>
  <circle class="star s3" cx="268" cy="40" r="1.4"/>
  <circle class="star" cx="290" cy="112" r="1"/>
  <circle class="star s2" cx="30" cy="150" r="1"/>
  <circle class="star s3" cx="62" cy="256" r="1.3"/>
  <circle class="star" cx="150" cy="292" r="1"/>
  <circle class="star s2" cx="284" cy="248" r="1.3"/>
  <circle class="star s3" cx="226" cy="284" r="1"/>
  <circle class="star" cx="196" cy="24" r="1"/>

  <g class="float">
    <rect x="122" y="150" width="20" height="56" rx="7" fill="#8f959d"/>

    <g fill="#d9dce0">
      <rect x="92" y="156" width="42" height="17" rx="8.5" transform="rotate(-24 134 164)"/>
      <rect x="186" y="156" width="42" height="17" rx="8.5" transform="rotate(24 186 164)"/>
      <rect x="140" y="198" width="18" height="50" rx="9"/>
      <rect x="162" y="198" width="18" height="50" rx="9"/>
    </g>
    <g fill="#8f959d">
      <rect x="138" y="238" width="22" height="13" rx="6"/>
      <rect x="160" y="238" width="22" height="13" rx="6"/>
      <circle cx="96" cy="148" r="8"/>
      <circle cx="224" cy="148" r="8"/>
    </g>

    <rect x="134" y="148" width="52" height="62" rx="15" fill="#f1f3f5"/>
    <rect x="148" y="168" width="24" height="16" rx="4" fill="#b4b9c0"/>
    <circle cx="154" cy="176" r="2.2" fill="#3b4048"/>
    <circle cx="166" cy="176" r="2.2" fill="#3b4048"/>

    <circle cx="160" cy="122" r="33" fill="#f1f3f5"/>
    <rect x="136" y="106" width="48" height="33" rx="16" fill="#191c21"/>
    <path d="M145 118 C149 112 155 110 162 110" fill="none" stroke="#aeb4bc" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
