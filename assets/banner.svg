<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Welcome to Art's GitHub">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.6" stop-color="#14171c"/>
      <stop offset="1" stop-color="#3b4048"/>
    </linearGradient>
    <linearGradient id="d1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2e34"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#23262b"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="d3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c0d10"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f4f6f8" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <style>
      .title { font: 500 38px Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #e6e8eb; letter-spacing: 1px; }
      .sub { font: 400 24px Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #aeb4bc; }
      .star { fill: #e6e8eb; animation: twinkle 5s ease-in-out infinite; }
      .s2 { animation-delay: 1.4s; }
      .s3 { animation-delay: 2.8s; }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) { .star { animation: none; opacity: 0.6; } }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <g>
    <circle class="star" cx="96" cy="48" r="1.3"/>
    <circle class="star s2" cx="212" cy="92" r="1"/>
    <circle class="star s3" cx="318" cy="36" r="1.4"/>
    <circle class="star" cx="168" cy="150" r="1"/>
    <circle class="star s3" cx="402" cy="126" r="1"/>
    <circle class="star s2" cx="822" cy="40" r="1.3"/>
    <circle class="star" cx="938" cy="104" r="1"/>
    <circle class="star s3" cx="1052" cy="58" r="1.4"/>
    <circle class="star s2" cx="1128" cy="138" r="1"/>
    <circle class="star" cx="762" cy="134" r="1"/>
    <circle class="star s2" cx="52" cy="122" r="1"/>
    <circle class="star s3" cx="1168" cy="28" r="1"/>
  </g>

  <text class="title" x="600" y="118" text-anchor="middle">Welcome to Art's GitHub</text>
  <text class="sub" x="600" y="160" text-anchor="middle">&lt;/&gt;</text>

  <path d="M0 262 C150 214 290 210 450 244 C610 278 760 222 920 212 C1030 205 1120 224 1200 246 V400 H0 Z" fill="url(#d1)"/>
  <path d="M0 306 C170 262 350 268 540 300 C720 330 900 266 1200 286 V400 H0 Z" fill="url(#d2)"/>

  <path d="M0 344 C220 304 430 322 640 352 C860 384 1040 326 1200 334 V400 H0 Z" fill="url(#d3)"/>

  <path d="M612 248 C652 262 680 272 650 284 C606 300 520 304 548 322 C584 344 760 340 728 362 C700 380 620 386 560 400 L700 400 C772 386 858 368 812 346 C764 324 640 330 628 316 C618 304 716 298 720 280 C724 266 668 256 612 248 Z" fill="url(#stream)" filter="url(#soft)"/>
</svg>
